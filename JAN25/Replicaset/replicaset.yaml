apiVersion: apps/v1
kind: ReplicaSet
metadata: 
    name: replicaset
spec:
  minReadySeconds: 3
  replicas: 4
  selector:
      matchLabels:
         app: web
  template:
    metadata:
       labels:
         app: web
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
