apiVersion: apps/v1
kind: Deployment
metadata: 
    name: deploy
spec:
  minReadySeconds: 3
  replicas: 2
  revisionHistoryLimit: 10
  selector:
      matchLabels:
         app: admin
  strategy:
     type: RollingUpdate
     rollingUpdate:
         maxSurge: 25%
         maxUnavailable: 25%
  template:
    metadata:
       labels:
         app: admin
    spec:
      containers:
        - name: admin
          image: nharshitha29/catalog:v1.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
    name: deploy
spec:
  type: NodePort
  selector:
     app: admin
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 30678

