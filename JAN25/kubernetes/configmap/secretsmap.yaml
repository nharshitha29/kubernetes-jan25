apiVersion: v1
kind: Pod
metadata:
  name: mysql
spec:
  containers:
    - name: mysql-pod
      image: mysql:latest
      envFrom: 
          - secretRef:
              name: secret-cm 
      ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
    - name: test-pod
      image: alpine
      envFrom:
         - secretRef:
             name: secret-cm 
      command:
         - sleep
         - "3600s"