apiVersion: apps/v1
kind: Deployment
metadata:
   name: home
spec:
  minReadySeconds: 3
  replicas: 2
  revisionHistoryLimit: 10
  selector: 
     matchLabels:
        app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
       maxSurge: 25%
       maxUnavailable: 25%
  template:
    metadata:
      labels:
         app: web
    spec:
      containers:
        - name: admin
          image: shaikkhajaibrahim/ingress-home:1.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
   name: home-service
spec:
  type: ClusterIP
  selector:
      app: web
  ports:
    - name: network
      port: 80
      protocol: TCP
      targetPort: 80