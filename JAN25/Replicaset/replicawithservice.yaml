---
apiVersion: apps/v1
kind: ReplicaSet
metadata: 
    name: replicaset
spec:
  minReadySeconds: 3
  replicas: 4
  selector:
      matchLabels:
         app: web
  template:
    metadata:
       labels:
         app: web
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---       
apiVersion: v1
kind: Service
metadata:
   name: service-1
spec:
   type: ClusterIP
   selector:
        app: web 
   ports:
     - name: web
       port: 80
       protocol: TCP
       targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
   name: service-1
spec:
   type: NodePort
   selector:
        app: web 
   ports:
     - name: web
       port: 80
       protocol: TCP
       targetPort: 80
       nodePort: 30000